<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة البزل</title>
<style>
  :root {
    --bg1: #1a1410;
    --bg2: #2b2015;
    --accent: #c9a24b;
    --accent-dark: #8a6a2a;
    --stone: #d8b877;
    --text: #f3ead9;
    --muted: #b3a78e;
    --success: #4caf50;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at 20% 10%, #33281a, #14100c 70%);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 8px 0 4px;
    color: var(--accent);
    letter-spacing: 1px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.95rem;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stat {
    background: linear-gradient(145deg, #241c12, #171208);
    border: 1px solid #4a3c22;
    border-radius: 10px;
    padding: 8px 18px;
    min-width: 90px;
  }
  .stat .label { font-size: 0.75rem; color: var(--muted); }
  .stat .value { font-size: 1.3rem; color: var(--accent); font-weight: bold; }

  .board {
    position: relative;
    direction: ltr;
    width: min(92vw, 480px);
    aspect-ratio: 4 / 2.917;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 3px;
    background: #100c08;
    border: 6px solid var(--accent-dark);
    border-radius: 10px;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5);
  }
  .cell {
    position: relative;
    background: #0d0a06;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .piece:active { cursor: grabbing; }
  .piece.dragging {
    opacity: 0.35;
  }
  .cell.dragover .piece,
  .cell.dragover.empty-target {
    box-shadow: 0 0 0 3px var(--accent) inset;
  }
  .piece.correct {
    filter: saturate(1.05);
  }
  .piece.correct::after {
    content: '';
  }
  .piece.check-correct {
    box-shadow: 0 0 0 3px var(--success) inset, 0 0 12px rgba(76,175,80,0.9);
  }
  .piece.check-wrong {
    box-shadow: 0 0 0 3px #e05b4f inset, 0 0 10px rgba(224,91,79,0.6);
  }
  .piece-label {
    position: absolute;
    bottom: 3px;
    left: 3px;
    background: rgba(0,0,0,0.65);
    color: #f3ead9;
    font-size: 11px;
    font-weight: bold;
    padding: 1px 6px;
    border-radius: 4px;
    pointer-events: none;
    display: none;
    z-index: 2;
    font-family: monospace;
  }
  .cell-index {
    position: absolute;
    top: 3px;
    right: 3px;
    background: rgba(201,162,75,0.85);
    color: #201803;
    font-size: 11px;
    font-weight: bold;
    padding: 1px 6px;
    border-radius: 4px;
    pointer-events: none;
    display: none;
    z-index: 2;
    font-family: monospace;
  }
  .show-labels .piece-label,
  .show-labels .cell-index {
    display: block;
  }

  .controls {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    background: linear-gradient(145deg, var(--accent), var(--accent-dark));
    color: #201803;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    transition: transform 0.1s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent-dark);
    box-shadow: none;
  }

  .preview-toggle {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    user-select: none;
  }
  .preview {
    display: none;
    margin: 14px auto 0;
    width: min(60vw, 260px);
    border-radius: 8px;
    overflow: hidden;
    border: 3px solid var(--accent-dark);
  }
  .preview.show { display: block; }
  .preview img { width: 100%; display: block; }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 7, 3, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .win-overlay.show { display: flex; }
  .win-card {
    background: linear-gradient(160deg, #2b2015, #171208);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 30px 26px;
    text-align: center;
    max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .win-card h2 {
    color: var(--accent);
    margin: 0 0 10px;
    font-size: 1.5rem;
  }
  .win-card p { color: var(--text); margin: 6px 0; }
  .win-card img {
    width: 100%;
    border-radius: 8px;
    margin: 14px 0;
    border: 2px solid var(--accent-dark);
  }

  /* touch drag helpers */
  .piece.touch-selected {
    box-shadow: 0 0 0 3px var(--accent) inset, 0 0 14px rgba(201,162,75,0.8);
  }
</style>

<script>
(function() {
  const GRID = 4; // 4x4 = 16 pieces
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const winOverlay = document.getElementById('winOverlay');
  const winStats = document.getElementById('winStats');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const checkBtn = document.getElementById('checkBtn');
  const solveHintBtn = document.getElementById('solveHintBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const previewToggle = document.getElementById('previewToggle');
  const previewBox = document.getElementById('previewBox');
  const checkResult = document.getElementById('checkResult');

  let cells = [];       // DOM cell elements, index = board position (0..15)
  let order = [];       // order[boardPos] = pieceId currently placed there
  let moves = 0;
  let seconds = 0;
  let timerInterval = null;
  let started = false;
  let touchSelected = null; // boardPos selected via tap
  let won = false;

  function buildBoard() {
    board.innerHTML = '';
    cells = [];
    for (let i = 0; i < GRID * GRID; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.pos = i;

      const piece = document.createElement('div');
      piece.className = 'piece';
      piece.draggable = true;

      const pieceLabel = document.createElement('span');
      pieceLabel.className = 'piece-label';
      piece.appendChild(pieceLabel);

      const cellIndex = document.createElement('span');
      cellIndex.className = 'cell-index';
      cellIndex.textContent = i;
      cell.appendChild(cellIndex);

      cell.appendChild(piece);

      board.appendChild(cell);
      cells.push(cell);
    }
  }

  function setPieceBackground(piece, pieceId) {
    const row = Math.floor(pieceId / GRID);
    const col = pieceId % GRID;
    const posX = (col / (GRID - 1)) * 100;
    const posY = (row / (GRID - 1)) * 100;
    piece.style.backgroundPosition = posX + '% ' + posY + '%';
    piece.dataset.pieceId = pieceId;
    const label = piece.querySelector('.piece-label');
    if (label) label.textContent = pieceId;
  }

  function render() {
    order.forEach((pieceId, pos) => {
      const piece = cells[pos].querySelector('.piece');
      setPieceBackground(piece, pieceId);
      piece.classList.toggle('correct', pieceId === pos);
    });
  }

  function shuffle() {
    order = Array.from({length: GRID*GRID}, (_, i) => i);
    // Fisher-Yates, ensure not solved and reasonably shuffled
    do {
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    } while (isSolved());
    moves = 0;
    seconds = 0;
    started = false;
    won = false;
    updateMoves();
    updateTimer();
    clearInterval(timerInterval);
    winOverlay.classList.remove('show');
    render();
  }

  function isSolved() {
    return order.every((pieceId, pos) => pieceId === pos);
  }

  function updateMoves() {
    movesEl.textContent = moves;
  }

  function updateTimer() {
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = m + ':' + s;
  }

  function startTimerIfNeeded() {
    if (started) return;
    started = true;
    timerInterval = setInterval(() => {
      seconds++;
      updateTimer();
    }, 1000);
  }

  function swapPositions(posA, posB) {
    if (posA === posB) return;
    [order[posA], order[posB]] = [order[posB], order[posA]];
    moves++;
    updateMoves();
    render();
    checkWin();
  }

  function checkWin() {
    if (isSolved()) {
      won = true;
      clearInterval(timerInterval);
      winStats.textContent = 'الحركات: ' + moves + ' — الوقت: ' + timerEl.textContent;
      setTimeout(() => winOverlay.classList.add('show'), 300);
    }
  }

  // Drag & drop (desktop)
  let dragSrcPos = null;

  board.addEventListener('dragstart', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    dragSrcPos = parseInt(cell.dataset.pos, 10);
    e.target.classList.add('dragging');
    startTimerIfNeeded();
  });

  board.addEventListener('dragend', (e) => {
    e.target.classList.remove('dragging');
    cells.forEach(c => c.classList.remove('dragover'));
  });

  board.addEventListener('dragover', (e) => {
    e.preventDefault();
    const cell = e.target.closest('.cell');
    cells.forEach(c => c.classList.remove('dragover'));
    if (cell) cell.classList.add('dragover');
  });

  board.addEventListener('drop', (e) => {
    e.preventDefault();
    const cell = e.target.closest('.cell');
    cells.forEach(c => c.classList.remove('dragover'));
    if (!cell || dragSrcPos === null) return;
    const targetPos = parseInt(cell.dataset.pos, 10);
    swapPositions(dragSrcPos, targetPos);
    dragSrcPos = null;
  });

  // Tap-to-swap (mobile friendly)
  board.addEventListener('click', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const pos = parseInt(cell.dataset.pos, 10);
    startTimerIfNeeded();

    if (touchSelected === null) {
      touchSelected = pos;
      cell.querySelector('.piece').classList.add('touch-selected');
    } else {
      const prevCell = cells[touchSelected];
      prevCell.querySelector('.piece').classList.remove('touch-selected');
      if (touchSelected !== pos) {
        swapPositions(touchSelected, pos);
      }
      touchSelected = null;
    }
  });

  function checkPieces() {
    startTimerIfNeeded();
    let correctCount = 0;
    order.forEach((pieceId, pos) => {
      const piece = cells[pos].querySelector('.piece');
      piece.classList.remove('check-correct', 'check-wrong');
      if (pieceId === pos) {
        piece.classList.add('check-correct');
        correctCount++;
      } else {
        piece.classList.add('check-wrong');
      }
    });

    checkResult.textContent = correctCount + ' من أصل ' + (GRID * GRID) + ' قطعة في مكانها الصحيح';

    clearTimeout(checkPieces._timeout);
    checkPieces._timeout = setTimeout(() => {
      cells.forEach(c => {
        const piece = c.querySelector('.piece');
        piece.classList.remove('check-correct', 'check-wrong');
      });
    }, 2000);
  }

  labelsBtn.addEventListener('click', () => {
    board.classList.toggle('show-labels');
    labelsBtn.textContent = board.classList.contains('show-labels')
      ? 'إخفاء أرقام القطع'
      : 'إظهار أرقام القطع';
  });

  checkBtn.addEventListener('click', checkPieces);
  shuffleBtn.addEventListener('click', () => { checkResult.textContent = ''; shuffle(); });
  playAgainBtn.addEventListener('click', () => {
    winOverlay.classList.remove('show');
    checkResult.textContent = '';
    shuffle();
  });

  solveHintBtn.addEventListener('click', () => {
    previewBox.classList.add('show');
    previewBox.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  });

  previewToggle.addEventListener('click', () => {
    previewBox.classList.toggle('show');
  });

  buildBoard();
  shuffle();
})();
</script>
</body>
</html>
